/* ---------------------------------------------------------------------------
   Discovery One, more or less.

   The displays in 2001 are pure black with thin coloured geometry floating on
   them, and every label is a short word in widely spaced capitals. What is NOT
   there is the whole vocabulary of screen-pastiche: no scanlines, no glow, no
   chromatic fringing, no bevels, no rounded corners, no gradients. Kubrick's
   futurism is austere, and that restraint is the entire difference between the
   film and every homage to it. So: hairlines, flat fills, one typeface.

   Alte Haas Grotesk throughout, subset and embedded, because at anchor there
   is frequently no internet and a page whose type only sometimes arrives is
   worse than one that always looks the same. It has tabular figures, so it can
   carry the readouts as well as the words and the page needs no second family.

   Three worlds, and all three are in the film: the console is black, the ship
   is white, and HAL is red.
--------------------------------------------------------------------------- */

:root {
  /* The console. Pure black, because that is what those screens are. */
  --ground: #000000;
  --panel: #000000;
  --rule: #262624;
  --ink: #ededea;
  --faint: #6e6e6b;
  --accent: #ff6a00;
  --warn: #ffa300;
  --alarm: #e01b12;
  --ok: #12a05b;
  --focus: #ff6a00;

  --step-0: 0.68rem;
  --step-1: 0.92rem;
  --step-2: 1.45rem;
  --step-3: 2.05rem;
  --track: 0.28em;

  --face: "Alte Haas Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
}

:root[data-mode="day"] {
  /* The ship. The centrifuge, the pod bay and the Jupiter room are all white,
     and this is the same page seen in daylight on deck. */
  --ground: #f2f1ed;
  --panel: #ffffff;
  --rule: #cbcac4;
  --ink: #0a0a0a;
  --faint: #6a6a66;
  --accent: #c4451c;
  --warn: #9a5511;
  --alarm: #c1121c;
  --ok: #1d6b45;
  --focus: #c4451c;
}

:root[data-mode="red"] {
  /* HAL. One hue at low luminance, which is also the only thing that does not
     cost twenty minutes of dark adaptation. */
  --ground: #060000;
  --panel: #060000;
  --rule: #350808;
  --ink: #e0473c;
  --faint: #7e241e;
  --accent: #ff3b2f;
  --warn: #ff7a5c;
  --alarm: #ff1e10;
  --ok: #a83028;
  --focus: #ff3b2f;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0 0 3rem;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--face);
  font-size: var(--step-1);
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

main {
  max-width: 30rem;
  margin: 0 auto;
  padding: 0 1.1rem;
  display: flex;
  flex-direction: column;
}
.port, .starboard, .deck, .hands, .tail, .stack { display: contents; }
.masthead { order: 1; }
.standby { order: 1; }
.says { order: 2; }
.alerts { order: 3; }
.plot { order: 4; }
.anchor-controls { order: 5; }
.wind { order: 6; }
.gauges { order: 7; }
.speaker { order: 8; }
.modes { order: 9; }
footer { order: 10; }
.circle-field { flex: 0 0 7.5rem; }
.stack-end { display: flex; align-items: flex-end; }

/* --- the caption card ---------------------------------------------------- */

.masthead {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 1.2rem 0 0.5rem;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 0.9rem;
}
.vessel {
  font-size: var(--step-0);
  letter-spacing: var(--track);
  text-transform: uppercase;
  color: var(--ink);
  font-weight: 700;
}
.clock {
  font-size: var(--step-0);
  letter-spacing: 0.14em;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
}
.clock.stale { color: var(--alarm); }

/* The status word, which is how the film labels everything: one short word in
   capitals, spaced out, and the detail underneath in a human sentence. */
.status {
  font-size: var(--step-0);
  letter-spacing: var(--track);
  text-transform: uppercase;
  font-weight: 700;
  color: var(--faint);
  margin-bottom: 0.25rem;
}
.status.nominal { color: var(--ok); }
.status.caution { color: var(--accent); }
.status.alarm { color: var(--alarm); }

.verdict {
  font-size: var(--step-3);
  line-height: 1.08;
  font-weight: 400;
  letter-spacing: -0.005em;
  text-wrap: balance;
  margin: 0 0 0.25rem;
  color: var(--ink);
}
.because { color: var(--faint); font-size: var(--step-0); margin-bottom: 1rem; }

/* --- silenced ------------------------------------------------------------

   Above the masthead and drawn in the alarm colour, filled rather than
   outlined, because it is the one thing on this page that makes everything
   below it untrue. A silenced boat draws a perfectly calm plot.
-------------------------------------------------------------------------- */

.standby {
  border: 1px solid var(--alarm);
  border-left-width: 4px;
  padding: 0.6rem 0.75rem;
  margin-bottom: 0.9rem;
  color: var(--alarm);
}
.standby[hidden] { display: none; }
.standby .head {
  font-size: var(--step-0);
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.standby .said { color: var(--alarm); }

/* --- alerts -------------------------------------------------------------- */

.alerts { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
.alert {
  border: 1px solid var(--accent);
  border-left-width: 4px;
  padding: 0.6rem 0.75rem;
}
.alert[data-severity="alarm"], .alert[data-severity="emergency"] {
  border-color: var(--alarm);
}
.alert .what { font-size: var(--step-1); }
.alert .who {
  font-size: var(--step-0);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--faint);
  margin-top: 0.25rem;
}

/* --- the plot ------------------------------------------------------------ */

.plot {
  background: var(--panel);
  border: 1px solid var(--rule);
  padding: 0.9rem 0.9rem 0.5rem;
}
.plot svg { display: block; width: 100%; height: auto; }
.readout {
  display: flex;
  flex-wrap: wrap;
  gap: 0.1rem 1.5rem;
  font-size: var(--step-0);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
  padding-top: 0.6rem;
  margin-top: 0.5rem;
  border-top: 1px solid var(--rule);
}
.readout b { color: var(--ink); font-weight: 700; letter-spacing: 0.06em; }

/* --- sections ------------------------------------------------------------ */

section { padding: 1.1rem 0 0; }
/* Every block is announced by a ruled label. It is what makes the page read
   as a set of panels rather than a list, and it is how the film labels
   everything: a hairline, a short word, the thing itself. */
h2 {
  font-size: var(--step-0);
  letter-spacing: var(--track);
  text-transform: uppercase;
  color: var(--faint);
  font-weight: 700;
  margin: 0 0 0.55rem;
  padding-top: 0.5rem;
  border-top: 1px solid var(--rule);
}
.line { color: var(--ink); }
.line.quiet { color: var(--faint); }

.graph {
  background: var(--panel);
  border: 1px solid var(--rule);
  padding: 0.7rem 0.5rem 0.3rem;
  height: 9rem;
}
.graph svg { display: block; width: 100%; height: 100%; }

/* --- readout blocks: a word above a figure, butted together on a grid ----- */

.instruments {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  border-top: 1px solid var(--rule);
  border-left: 1px solid var(--rule);
}
.instrument {
  padding: 0.5rem 0.7rem 0.55rem;
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.instrument .k {
  display: block;
  font-size: var(--step-0);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--faint);
  font-weight: 700;
}
.instrument .v {
  display: block;
  font-size: var(--step-2);
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}
.instrument .v.absent { color: var(--faint); }
.instrument .u {
  font-size: var(--step-0);
  letter-spacing: 0.1em;
  color: var(--faint);
  margin-left: 0.25rem;
}

/* --- controls: illuminated rectangles ------------------------------------ */

.controls { display: flex; gap: 0.5rem; padding-top: 0.6rem; }
.controls > * { flex: 1; }
button {
  font-family: var(--face);
  font-size: var(--step-0);
  font-weight: 700;
  letter-spacing: var(--track);
  text-transform: uppercase;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--rule);
  padding: 0.9rem 0.5rem;
  min-height: 3rem;
  width: 100%;
  cursor: pointer;
}
button:hover { border-color: var(--faint); }
button:active { background: var(--rule); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--ground); }
button.undo { border-color: var(--alarm); color: var(--alarm); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

label {
  display: block;
  font-size: var(--step-0);
  color: var(--faint);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 0.3rem;
}
input[type="number"] {
  font-family: var(--face);
  font-size: var(--step-2);
  font-variant-numeric: tabular-nums;
  width: 100%;
  padding: 0.5rem 0.65rem;
  min-height: 3rem;
  background: var(--panel);
  color: var(--ink);
  border: 1px solid var(--rule);
}
.said {
  font-size: var(--step-0);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  min-height: 1.2rem;
  padding-top: 0.5rem;
  color: var(--accent);
}
.said.bad { color: var(--alarm); }

.modes { display: flex; gap: 0.5rem; padding-top: 1.5rem; }
.modes button[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--ground);
}

footer {
  font-size: var(--step-0);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
  padding-top: 1.1rem;
  text-align: center;
}

@media (prefers-reduced-motion: no-preference) {
  .boat-halo { animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.12; } }
}

/* --- a laptop screen ----------------------------------------------------
   Wide enough for two panels and tall enough to hold them: stop being a
   column and become an instrument that fits, with nothing to scroll. */
@media (min-width: 62rem) and (min-height: 34rem) {
  html, body { height: 100%; }
  body { overflow: hidden; padding: 0; }

  main {
    max-width: none;
    height: 100dvh;
    padding: 0 1.4rem 1.1rem;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    gap: 0.2rem;
  }
  .masthead { padding: 0.9rem 0 0.5rem; margin-bottom: 0; }

  .deck {
    display: grid;
    grid-template-columns: minmax(0, 0.78fr) minmax(24rem, 1fr);
    gap: 1.4rem;
    min-height: 0;
  }
  .port { display: flex; flex-direction: column; min-height: 0; }
  .starboard {
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    min-height: 0;
    overflow: hidden;
  }

  .plot { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .plot svg { flex: 1; min-height: 0; height: auto; }
  .readout { flex: 0 0 auto; }

  .masthead, .says, .alerts, .plot, .anchor-controls,
  .wind, .gauges, .speaker, .modes, footer { order: 0; }
  section { padding: 0; }
  .verdict { font-size: clamp(1.6rem, 2.2vw, 2.3rem); }
  h2 { margin-bottom: 0.4rem; padding-top: 0.45rem; }
  .alerts { margin-bottom: 0; }
  .alerts:empty { display: none; }
  .because { margin-bottom: 0.1rem; }

  /* Everything that can grow lives in here, and this is the only thing
     allowed to scroll. The mode switch sits outside it, because an
     unreachable red button is the same as no red button. */
  .stack {
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
  }

  .wind { display: flex; flex-direction: column; gap: 0.4rem; }
  .graph { height: clamp(6.5rem, 17vh, 10.5rem); }
  .says, .alerts, .wind, .gauges, .hands { flex: 0 0 auto; }

  .instruments { grid-template-columns: repeat(4, 1fr); }
  .instrument { padding: 0.35rem 0.6rem 0.4rem; }
  .instrument .v { font-size: var(--step-1); }

  .hands { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem; align-items: start; }
  .controls { padding-top: 0.4rem; }
  button { min-height: 2.6rem; padding: 0.55rem 0.5rem; }
  input[type="number"] { min-height: 2.6rem; }
  .said { padding-top: 0.3rem; min-height: 1rem; }

  .tail {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex: 0 0 auto;
    margin-top: auto;
    padding-top: 0.6rem;
  }
  .modes { padding-top: 0; width: auto; }
  .modes button { min-height: 2.1rem; padding: 0.3rem 0.9rem; width: auto; }
  footer { padding-top: 0; text-align: right; }
}
</style>
</head>
<body>
<main>
  <section class="standby" id="standby" hidden>
    <div class="head">Alerts silenced</div>
    <div class="line" id="standby-text">Nothing will reach you.</div>
    <div class="controls">
      <button id="unsilence">Turn the alarms back on</button>
    </div>
    <div class="said" id="standby-said"></div>
  </section>

  <div class="masthead">
    <div class="vessel" id="vessel">Seabird</div>
    <div class="clock" id="clock">&mdash;</div>
  </div>

  <div class="deck">
    <div class="port">
      <div class="plot">
        <svg id="swing" viewBox="-128 -128 256 256" preserveAspectRatio="xMidYMid meet"
             role="img" aria-labelledby="swing-title">
          <title id="swing-title">The anchor, the watch circle, and where the boat has been</title>
        </svg>
        <div class="readout" id="readout"></div>
      </div>
    </div>

    <div class="starboard">
      <div class="stack">
      <div class="says">
        <div class="status" id="status">Standing by</div>
        <h1 class="verdict" id="verdict">Reading the boat</h1>
        <div class="because" id="because">asking the agent what it can see</div>
      </div>

      <div class="alerts" id="alerts"></div>

      <section class="wind">
        <h2>Wind, next 24 hours</h2>
        <div class="graph">
          <svg id="wind" viewBox="0 0 320 122" preserveAspectRatio="xMidYMid meet"
               role="img" aria-labelledby="wind-title">
            <title id="wind-title">Forecast wind and gusts, with the dark hours shaded</title>
          </svg>
        </div>
        <div class="line" id="forecast">&mdash;</div>
        <div class="because" id="forecast-age"></div>
      </section>

      <section class="gauges">
        <h2>Instruments</h2>
        <div class="instruments" id="instruments"></div>
      </section>

      <div class="hands">
        <section class="anchor-controls">
          <h2>Anchor</h2>
          <div class="controls">
            <div class="circle-field">
              <label for="radius">Circle, m</label>
              <input type="number" id="radius" value="40" min="5" max="500" step="5"
                     inputmode="numeric">
            </div>
            <div class="stack-end">
              <button class="primary" id="down">Anchor down</button>
            </div>
          </div>
          <div class="controls">
            <button class="undo" id="up">Anchor up</button>
          </div>
          <div class="said" id="anchor-said"></div>
        </section>

        <section class="speaker">
          <h2>Speaker</h2>
          <div class="line quiet" id="hush">The alarm will sound if one is raised.</div>
          <div class="controls">
            <button id="hush30">Hush 30 min</button>
            <button id="unhush">Let it sound</button>
          </div>
          <div class="said" id="hush-said"></div>

          <h2>Every channel</h2>
          <div class="line quiet" id="silence-state">
            Speaker, Signal and the laptop screen are all live.
          </div>
          <div class="controls">
            <button class="undo" id="silence">Silence everything</button>
          </div>
          <div class="said" id="silence-said"></div>
        </section>
      </div>

      </div>

      <div class="tail">
        <div class="modes">
          <button type="button" data-mode="day" aria-pressed="false">Day</button>
          <button type="button" data-mode="night" aria-pressed="true">Night</button>
          <button type="button" data-mode="red" aria-pressed="false">Red</button>
        </div>
        <footer id="foot">connecting</footer>
      </div>
    </div>
  </div>
</main>

<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const token = new URLSearchParams(location.search).get("t") || "";
const $ = (id) => document.getElementById(id);
const KN = 1.9438444924406046;
let last = null;

/* --- the mode the crew chose, remembered -------------------------------- */

try {
  const saved = localStorage.getItem("boat-mode");
  if (saved) document.documentElement.dataset.mode = saved;
} catch (e) { /* private window, or storage blocked: night it is */ }

function markModes() {
  const now = document.documentElement.dataset.mode;
  for (const b of document.querySelectorAll(".modes button")) {
    b.setAttribute("aria-pressed", String(b.dataset.mode === now));
  }
}
for (const b of document.querySelectorAll(".modes button")) {
  b.addEventListener("click", () => {
    document.documentElement.dataset.mode = b.dataset.mode;
    try { localStorage.setItem("boat-mode", b.dataset.mode); } catch (e) {}
    markModes();
    if (last) draw(last);
  });
}
markModes();

/* --- talking to the agent ----------------------------------------------- */

async function call(path, body) {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: {"Content-Type": "application/json", "X-Boat-Token": token},
    body: body ? JSON.stringify(body) : undefined,
  });
  return {code: res.status, data: await res.json()};
}

function el(name, attrs, parent) {
  const node = document.createElementNS(NS, name);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(node);
  return node;
}
function css(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function hypot(en) { return en ? Math.sqrt(en[0] * en[0] + en[1] * en[1]) : 0; }
function niceStep(raw) {
  for (const s of [5, 10, 20, 25, 50, 100, 250, 500]) if (raw <= s) return s;
  return 1000;
}
function cap(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : ""; }

/* --- the swing plot ------------------------------------------------------ */

function drawSwing(s) {
  const svg = $("swing");
  while (svg.childNodes.length > 1) svg.removeChild(svg.lastChild);

  const a = s.anchor || {};
  const ink = css("--ink"), faint = css("--faint"), rule = css("--rule");
  const amber = css("--accent"), alarm = css("--alarm"), deck = css("--panel");

  if (!a.set) {
    el("circle", {cx: 0, cy: 0, r: 84, fill: "none", stroke: rule,
                  "stroke-width": 1, "stroke-dasharray": "3 6"}, svg);
    const t = el("text", {x: 0, y: 4, "text-anchor": "middle", fill: faint,
                          "font-size": 11, "letter-spacing": "0.18em"}, svg);
    t.textContent = "NO WATCH SET";
    return;
  }

  /* One scale places everything. The alarm ring is the outermost thing that
     must always fit; if the boat is outside it, the boat sets the scale, so a
     drag can never run off the edge of the picture. */
  const margin = 10;
  const reach = Math.max(a.radius_m + margin, hypot(a.east_north) * 1.12, 1);
  const k = 100 / reach;
  const P = (en) => [en[0] * k, -en[1] * k];   /* north up */

  const step = niceStep(reach / 3.2);
  for (let r = step; r < a.radius_m * 0.94; r += step) {
    el("circle", {cx: 0, cy: 0, r: r * k, fill: "none", stroke: rule, "stroke-width": 0.8}, svg);
    const label = el("text", {x: 2.5, y: -r * k - 2.5, fill: faint, "font-size": 7.5,
                              "font-family": "var(--mono)"}, svg);
    label.textContent = r + " m";
  }

  /* Bearing ticks, so this reads as a compass rose and not as a target. */
  for (const point of [[0, "N"], [90, "E"], [180, "S"], [270, "W"]]) {
    const rad = point[0] * Math.PI / 180;
    el("line", {x1: Math.sin(rad) * 104, y1: -Math.cos(rad) * 104,
                x2: Math.sin(rad) * 110, y2: -Math.cos(rad) * 110,
                stroke: faint, "stroke-width": 1}, svg);
    const t = el("text", {x: Math.sin(rad) * 119, y: -Math.cos(rad) * 119 + 3.2,
                          "text-anchor": "middle", fill: point[0] === 0 ? ink : faint,
                          "font-size": 9, "font-weight": point[0] === 0 ? 700 : 400}, svg);
    t.textContent = point[1];
  }

  /* The watch circle, and the margin the drag rule actually allows before it
     calls it dragging. */
  el("circle", {cx: 0, cy: 0, r: (a.radius_m + margin) * k, fill: "none", stroke: alarm,
                "stroke-width": 0.8, "stroke-dasharray": "2 4", opacity: 0.65}, svg);
  el("circle", {cx: 0, cy: 0, r: a.radius_m * k, fill: "none", stroke: amber,
                "stroke-width": 1.4}, svg);
  const ringLabel = el("text", {x: 2.5, y: -a.radius_m * k - 3, fill: amber, "font-size": 8,
                                "font-family": "var(--mono)"}, svg);
  ringLabel.textContent = a.radius_m + " m";

  /* The track, oldest faintest, so the picture has a direction of travel. */
  const pts = a.track || [];
  const oldest = pts.length ? pts[0][2] || 1 : 1;
  for (let i = 1; i < pts.length; i++) {
    const from = P(pts[i - 1]), to = P(pts[i]);
    el("line", {x1: from[0], y1: from[1], x2: to[0], y2: to[1], stroke: amber,
                "stroke-width": 1.6, "stroke-linecap": "round",
                opacity: (0.12 + 0.68 * (1 - pts[i][2] / oldest)).toFixed(3)}, svg);
  }

  /* The anchor: a mark, not a dot, so it never reads as a second boat. */
  el("line", {x1: -4, y1: 0, x2: 4, y2: 0, stroke: ink, "stroke-width": 1.2}, svg);
  el("line", {x1: 0, y1: -4, x2: 0, y2: 4, stroke: ink, "stroke-width": 1.2}, svg);
  el("circle", {cx: 0, cy: 0, r: 2.6, fill: "none", stroke: ink, "stroke-width": 1.2}, svg);

  if (a.east_north) {
    const at = P(a.east_north);
    const outside = hypot(a.east_north) > a.radius_m + margin;
    const colour = outside ? alarm : amber;
    el("line", {x1: 0, y1: 0, x2: at[0], y2: at[1], stroke: colour,
                "stroke-width": 0.8, opacity: 0.45}, svg);
    const halo = el("circle", {cx: at[0], cy: at[1], r: 9, fill: colour, opacity: 0.24}, svg);
    halo.setAttribute("class", "boat-halo");
    el("circle", {cx: at[0], cy: at[1], r: 4.2, fill: colour, stroke: deck,
                  "stroke-width": 1.2}, svg);
  } else {
    const t = el("text", {x: 0, y: 120, "text-anchor": "middle", fill: alarm,
                          "font-size": 9}, svg);
    t.textContent = "no fix, so the boat is not on this plot";
  }
}

/* --- the wind trace ------------------------------------------------------ */

function drawWind(f) {
  const svg = $("wind");
  while (svg.childNodes.length > 1) svg.removeChild(svg.lastChild);

  const series = (f && f.series) || [];
  const ink = css("--ink"), faint = css("--faint"), rule = css("--rule");
  const amber = css("--accent"), warn = css("--warn");

  if (!series.length) {
    const wide = Math.max(240, Math.round(122 * (svg.getBoundingClientRect().width /
      Math.max(svg.getBoundingClientRect().height, 1))));
    svg.setAttribute("viewBox", "0 0 " + wide + " 122");
    const t = el("text", {x: wide / 2, y: 64, "text-anchor": "middle", fill: faint,
                          "font-size": 13, "letter-spacing": 1}, svg);
    t.textContent = (f && f.summary) || "no forecast";
    return;
  }

  /* The chart takes the shape of its container: the height of the drawing is
     fixed, so text stays a constant size, and the width follows the box. */
  const H = 122;
  const box = svg.getBoundingClientRect();
  const W = Math.max(240, Math.round(H * (box.width / Math.max(box.height, 1))));
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);

  const L = 46, R = W - 14, T = 12, B = H - 26;
  const span = f.graph_hours || 24;
  let peak = f.warn_gust || 0;
  for (const p of series) peak = Math.max(peak, p.wind || 0, p.gust || 0);
  peak = peak * 1.12 || 1;
  const X = (h) => L + (Math.min(Math.max(h, 0), span) / span) * (R - L);
  const Y = (ms) => B - (ms / peak) * (B - T);

  /* The dark hours, behind everything. When a blow lands matters as much as
     how hard it blows. */
  for (const span_ of f.dark || []) {
    el("rect", {x: X(span_[0]), y: T, width: Math.max(X(span_[1]) - X(span_[0]), 0),
                height: B - T, fill: ink, opacity: 0.07}, svg);
  }

  /* The line the forecast rule speaks up at, named in the units it thinks in. */
  if (f.warn_wind) {
    el("line", {x1: L, y1: Y(f.warn_wind), x2: R, y2: Y(f.warn_wind), stroke: warn,
                "stroke-width": 0.8, "stroke-dasharray": "3 3", opacity: 0.85}, svg);
    const t = el("text", {x: R, y: Y(f.warn_wind) - 4, "text-anchor": "end", fill: warn,
                          "font-size": 10, "font-family": "var(--mono)"}, svg);
    t.textContent = "F6";
  }

  /* The sea rides along the bottom of the same frame, on its own scale and
     without a line of its own. Wave height follows the wind closely enough
     that a second trace would mostly repeat the first; what is worth the ink
     is how much sea there will be under it, and when. */
  const sea = series.filter((p) => p.wave !== null && p.wave !== undefined);
  if (sea.length) {
    let tallest = 0;
    for (const p of sea) tallest = Math.max(tallest, p.wave);
    if (tallest > 0) {
      const band = (B - T) * 0.26;
      const SY = (m) => B - (m / tallest) * band;
      const ribbon = sea.map((p) => X(p.h) + "," + SY(p.wave)).join(" ");
      el("polygon", {points: X(sea[0].h) + "," + B + " " + ribbon + " " +
                             X(sea[sea.length - 1].h) + "," + B,
                     fill: faint, opacity: 0.3, stroke: "none"}, svg);
      const t = el("text", {x: L + 5, y: B - 4, fill: faint, "font-size": 10.5,
                            "font-family": "var(--mono)"}, svg);
      t.textContent = "sea " + tallest.toFixed(1) + " m";
    }
  }

  const wind = series.filter((p) => p.wind !== null && p.wind !== undefined);
  const gust = series.filter((p) => p.gust !== null && p.gust !== undefined);

  if (wind.length) {
    const trace = wind.map((p) => X(p.h) + "," + Y(p.wind)).join(" ");
    el("polygon", {points: X(wind[0].h) + "," + B + " " + trace + " " +
                           X(wind[wind.length - 1].h) + "," + B,
                   fill: amber, opacity: 0.14, stroke: "none"}, svg);
    el("polyline", {points: trace, fill: "none", stroke: amber, "stroke-width": 1.8,
                    "stroke-linejoin": "round"}, svg);
  }
  if (gust.length) {
    el("polyline", {points: gust.map((p) => X(p.h) + "," + Y(p.gust)).join(" "),
                    fill: "none", stroke: amber, "stroke-width": 1,
                    "stroke-dasharray": "2 2.5", opacity: 0.7}, svg);
  }

  el("line", {x1: L, y1: B, x2: R, y2: B, stroke: rule, "stroke-width": 1}, svg);
  for (let h = 0; h <= span; h += 6) {
    el("line", {x1: X(h), y1: B, x2: X(h), y2: B + 3, stroke: rule, "stroke-width": 1}, svg);
    /* The ends anchor inwards, so neither label runs off its own drawing. */
    const t = el("text", {x: X(h), y: B + 15,
                          "text-anchor": h === 0 ? "start" : (h === span ? "end" : "middle"),
                          fill: faint, "font-size": 11, "font-family": "var(--mono)"}, svg);
    t.textContent = h === 0 ? "now" : "+" + h + "h";
  }
  /* The unit rides on the top figure rather than sitting above it, where it
     had nothing to line up with and crowded the scale. */
  for (const ms of [0, peak / 2, peak]) {
    const t = el("text", {x: L - 5, y: Y(ms) + 4, "text-anchor": "end", fill: faint,
                          "font-size": 11, "font-family": "var(--mono)"}, svg);
    t.textContent = ms === peak ? Math.round(ms * KN) + " kn" : String(Math.round(ms * KN));
  }
}

/* --- the one line at the top --------------------------------------------- */

function verdict(s) {
  const alerts = s.alerts || [];
  const loud = alerts.find((a) => a.severity === "alarm" || a.severity === "emergency");
  const a = s.anchor || {};
  const gps = s.gps || {};

  if (loud) return ["alarm", loud.message, loud.rule];
  if (a.set && !gps.fix) return ["alarm", "The watch is blind", gps.text || ""];
  if (a.set && a.distance) {
    return [
      alerts.length ? "caution" : "nominal",
      "Holding, " + a.distance + " off",
      "inside a " + a.radius_m + " m circle set at " + a.set_at,
    ];
  }
  if (alerts.length) return ["caution", alerts[0].message, alerts[0].rule];
  return [gps.fix ? "nominal" : "", cap(s.state || "unknown"), s.reason || ""];
}

/* The film's own word for all-well, and real operational language besides. */
const STATUS_WORD = {
  nominal: "Nominal",
  caution: "Caution",
  alarm: "Alarm",
  "": "Standing by",
};

function draw(s) {
  if (!s) return;
  last = s;

  $("vessel").textContent = s.boat || "Seabird";

  const said = verdict(s);
  const status = $("status");
  status.textContent = STATUS_WORD[said[0]] || "Standing by";
  status.className = "status " + said[0];
  $("verdict").textContent = said[1];
  $("because").textContent = said[2];

  const box = $("alerts");
  box.replaceChildren();
  for (const a of s.alerts || []) {
    const wrap = document.createElement("div");
    wrap.className = "alert";
    wrap.dataset.severity = a.severity;
    const what = document.createElement("div");
    what.className = "what";
    what.textContent = a.message;
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = a.rule + " · since " + a.since;
    wrap.append(what, who);
    box.appendChild(wrap);
  }

  drawSwing(s);
  drawWind(s.forecast || {});

  const a = s.anchor || {};
  const gps = s.gps || {};
  const read = $("readout");
  read.replaceChildren();
  const facts = [];
  if (a.set) {
    facts.push(["off", a.distance || "no fix"]);
    if (a.bearing_deg !== null && a.bearing_deg !== undefined) {
      facts.push(["bearing", Math.round(a.bearing_deg) + "°"]);
    }
    facts.push(["circle", a.radius_m + " m"]);
    /* The number that says whether the circle is big enough, which no
       half-hour of plot can show. */
    if (a.furthest) {
      facts.push(["furthest", a.furthest + (a.watching ? " in " + a.watching : "")]);
    }
  }
  facts.push(["fix", s.position_ddm || (gps.fix ? s.position : "none")]);
  for (const fact of facts) {
    const span = document.createElement("span");
    const b = document.createElement("b");
    b.textContent = fact[1];
    span.append(fact[0] + " ", b);
    read.appendChild(span);
  }

  const f = s.forecast || {};
  $("forecast").textContent = f.hours ? "Next " + f.hours + " h: " + f.summary : (f.summary || "");
  /* Sea state, and how long the dark has left to run: the two things that
     decide whether you sit a blow out or move while you can still see. */
  const notes = [];
  if (f.sea) {
    notes.push("Sea to " + f.sea.height_m + " m" +
               (f.sea.period_s ? " at " + f.sea.period_s + " s" : "") +
               (f.sea.steep ? ", short and steep" : "") +
               (f.sea.at ? ", worst " + f.sea.at : ""));
  }
  if (f.dark_for) notes.push("Dark for another " + f.dark_for + " h");
  if (f.now) notes.push("Now " + f.now + ", fetched " + f.age_min + " min ago");
  $("forecast-age").textContent = notes.join(". ") + (notes.length ? "." : "");

  const grid = $("instruments");
  grid.replaceChildren();
  for (const r of s.readings || []) {
    const cell = document.createElement("div");
    cell.className = "instrument";
    const k = document.createElement("span");
    k.className = "k";
    k.textContent = r.label;
    const value = document.createElement("span");
    value.className = "v" + (r.value === null ? " absent" : "");
    value.textContent = r.value === null ? "\u2014" : r.value;
    if (r.value !== null) {
      const u = document.createElement("span");
      u.className = "u";
      u.textContent = r.unit;
      value.appendChild(u);
    }
    cell.append(k, value);
    grid.appendChild(cell);
  }

  $("hush").textContent = s.hush
    ? "Speaker quiet until " + s.hush + "."
    : "The alarm will sound if one is raised.";
  $("hush").className = "line" + (s.hush ? "" : " quiet");

  /* The banner is the whole point of showing this on a phone: the person
     holding it is the one who is not aboard to hear the speaker. */
  const off = s.silence;
  $("standby").hidden = !off;
  if (off) {
    $("standby-text").textContent =
      "Silenced since " + off.since + ", " + off.held_for + " ago" +
      (off.note ? " (" + off.note + ")" : "") +
      ". The speaker, Signal and the laptop screen are all off, and this does " +
      "not expire.";
  }
  $("silence-state").textContent = off
    ? "Silenced " + off.held_for + " ago. Nothing reaches anybody."
    : "Speaker, Signal and the laptop screen are all live.";
  $("silence-state").className = "line" + (off ? "" : " quiet");
  $("silence").disabled = !!off;

  const age = Math.round((Date.now() - new Date(s.generated_at)) / 1000);
  $("clock").textContent = s.clock || "";
  $("clock").className = "clock" + (age > 30 ? " stale" : "");
  $("foot").textContent = s.paths + " paths · " + s.deltas + " deltas · " + age + "s ago";
}

async function refresh() {
  try {
    const r = await call("/api/status");
    if (r.code !== 200) {
      $("status").textContent = "Refused";
      $("status").className = "status alarm";
      $("verdict").textContent = "Not allowed";
      $("because").textContent = "this link needs the token the agent printed when it started";
      return;
    }
    draw(r.data);
  } catch (e) {
    $("status").textContent = "No signal";
    $("status").className = "status alarm";
    $("verdict").textContent = "No answer from the agent";
    $("because").textContent = "it may have stopped, and the alarms stop with it";
  }
}

function say(where, text, good) {
  const node = $(where);
  node.textContent = text;
  node.className = "said" + (good ? "" : " bad");
  setTimeout(() => { node.textContent = ""; }, 7000);
}

async function act(path, body, said) {
  try {
    const r = await call(path, body || {});
    say(said, r.data.message || r.data.error || "done", r.code === 200);
  } catch (e) {
    say(said, "the agent did not answer", false);
  }
  refresh();
}

$("down").onclick = () => act("/api/anchor/down", {radius_m: Number($("radius").value)}, "anchor-said");
$("up").onclick = () => act("/api/anchor/up", {}, "anchor-said");
$("hush30").onclick = () => act("/api/hush", {minutes: 30}, "hush-said");
$("unhush").onclick = () => act("/api/unhush", {}, "hush-said");

/* Asked before doing, and only in this direction. Silencing her is the one
   control on this page that can leave somebody believing they are being
   watched when they are not; turning the alarms back on can only ever make
   the boat louder, so it happens on the first tap. */
$("silence").onclick = () => {
  const sure = confirm(
    "Silence the speaker, Signal and the laptop screen?\n\n" +
    "This does not expire. Nothing will reach you until you turn them back on.\n\n" +
    "She keeps watching and keeps her log either way."
  );
  if (sure) act("/api/silence", {}, "silence-said");
};
$("unsilence").onclick = () => act("/api/unsilence", {}, "standby-said");

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
